#!/bin/sh
#
# Raspberry Pi 5: an SD card image the VPU firmware boots directly, with no
# U-Boot and no EFI, carrying a live system and installer that run from
# memory and the media to install from.
#
#	release.sh -c release/arm64/RPI5.conf
#
# produces FreeBSD-<rev>-<branch>-arm64-aarch64-RPI5.img, laid out as
#
#	s1   FAT32 "RPI5BOOT"   config.txt, rpiboot.bin, mfsroot.ufs, the
#				device trees and overlays
#	s2a  UFS "RPI5INST"     /usr/freebsd-dist (base.txz, kernel.txz) and
#				/usr/freebsd-packages (offline pkgbase repo)
#
# The firmware loads rpiboot.bin as the kernel and mfsroot.ufs as the
# initramfs; rpiboot boots the FreeBSD kernel out of mfsroot.ufs and hands
# the whole image to it as its root.  The installer puts the new system on
# s2 of the same card and keeps s1, after which the card boots the installed
# kernel from boot.ufs instead.  See release/arm64/rpi5/.
#

DTB_DIR="/usr/local/share/rpi-firmware"
OL_DIR="${DTB_DIR}/overlays"
# bcm2712-rpi-5-b.dtb is required; the rest are copied when present, so the
# same image serves the Pi 500 and the CM5, and the D0 stepping, whose tree
# the firmware picks for itself.
DTB_REQUIRED="bcm2712-rpi-5-b.dtb"
DTB="bcm2712d0-rpi-5-b.dtb bcm2712-rpi-500.dtb bcm2712-rpi-cm5-cm5io.dtb \
	bcm2712-rpi-cm5l-cm5io.dtb"
EMBEDDED_TARGET_ARCH="aarch64"
EMBEDDED_TARGET="arm64"
EMBEDDEDBUILD=1
EMBEDDEDPORTS="sysutils/rpi-firmware"
FAT_SIZE="512m -b 1m"
FAT_TYPE="32"
IMAGE_SIZE="3072M"
MD_ARGS="-x 63 -y 255"
PART_SCHEME="MBR"
export BOARDNAME="RPI5"

#
# The only kernel the firmware-direct boot can run today.  The firmware
# resets PCIe and leaves it un-enumerated, and everything behind it -- RP1,
# so Ethernet, USB, GPIO, the fan PWM -- raises an SError when touched; see
# sys/arm64/conf/RPI5-FDT-NORP1.  Change this to RPI5-FDT once there is a
# brcm,bcm2712-pcie host controller driver.
#
KERNEL="RPI5-FDT-NORP1"

# The release targets the image's install media is built from; run by
# chroot_arm_build_release() before the image is assembled.
EMBEDDED_RELEASE_TARGETS="NOSRC=yes NOPORTS=yes packagesystem pkgbase-small"
EMBEDDED_RELEASE_ENV="PKGBASE_KERNEL=FreeBSD-kernel-$(echo ${KERNEL} | \
	tr '[:upper:]' '[:lower:]')"

# What the live root is installed without, on top of what mkmfsroot.sh
# prunes.  Kept as installworld knobs so nothing is built twice.
RPI5_MFS_KNOBS="MK_TOOLCHAIN=no MK_CLANG=no MK_LLD=no MK_LLDB=no \
	MK_LIB32=no MK_TESTS=no MK_DEBUG_FILES=no MK_KERNEL_SYMBOLS=no \
	MK_INCLUDES=no MK_INSTALLLIB=no MK_PROFILE=no MK_MAN=no MK_HTML=no \
	MK_EXAMPLES=no MK_DICT=no MK_GAMES=no MK_SENDMAIL=no MK_MAIL=no \
	MK_RESCUE=no MK_AT=no MK_ZFS=no MK_NLS=no"

# The CYW43455 WiFi firmware is not redistributable in base and no port
# is wired up for it yet.  Point this at a directory in the build chroot
# holding brcmfmac43455-sdio.{bin,txt,clm_blob} to put WiFi on the live
# system; see cyw(4).  Without it the live system has no network at all.
RPI5_CYW_FW_DIR=""

RPI5_FATLABEL="RPI5BOOT"
RPI5_INSTLABEL="RPI5INST"

arm_create_partitions() {
	export EFIPART_SUFFIX=s1
	export BSDLABEL_SUFFIX=s2
	export ROOTFSPART_SUFFIX=s2a
}

# As arm.subr's, but with the labels the live system and installer find the
# slices by, and FAT type 0x0c (FAT32 LBA), which is what the firmware wants
# for a FAT32 boot partition.
arm_create_disk() {
	if [ $(sysctl -n kern.geom.part.mbr.enforce_chs) != 0 ]; then
		return 1
	fi

	arm_create_partitions
	chroot ${CHROOTDIR} gpart create -s MBR ${mddev}
	chroot ${CHROOTDIR} gpart add -t '!12' -a 512k -s ${FAT_SIZE} ${mddev}
	chroot ${CHROOTDIR} gpart set -a active -i 1 ${mddev}
	chroot ${CHROOTDIR} gpart add -t freebsd ${mddev}
	chroot ${CHROOTDIR} gpart create -s bsd ${mddev}${BSDLABEL_SUFFIX}
	chroot ${CHROOTDIR} gpart add -t freebsd-ufs -a 64k -b 64k \
		${mddev}${BSDLABEL_SUFFIX}

	chroot ${CHROOTDIR} newfs_msdos -L ${RPI5_FATLABEL} -F ${FAT_TYPE} \
		/dev/${mddev}${EFIPART_SUFFIX}
	chroot ${CHROOTDIR} newfs -U -L ${RPI5_INSTLABEL} \
		/dev/${mddev}${ROOTFSPART_SUFFIX}

	return 0
}

# Build the live root, then fill the install slice with the media.
arm_install_base() {
	local _mfstree _kpkg _dist _pkgs

	_OSVERSION=$(chroot ${CHROOTDIR} /usr/bin/uname -U)
	REVISION=$(chroot ${CHROOTDIR} make -C /usr/src/release -V REVISION)
	BRANCH=$(chroot ${CHROOTDIR} make -C /usr/src/release -V BRANCH)
	export UNAME_r=${REVISION}-${BRANCH}

	_mfstree=${OBJDIR}/rpi5-mfsroot
	_kpkg=FreeBSD-kernel-$(echo ${KERNEL} | tr '[:upper:]' '[:lower:]')

	if [ -d ${CHROOTDIR}${_mfstree} ]; then
		chflags -R noschg ${CHROOTDIR}${_mfstree}
		rm -rf ${CHROOTDIR}${_mfstree}
	fi
	chroot ${CHROOTDIR} mkdir -p ${_mfstree}
	eval chroot ${CHROOTDIR} make -C ${WORLDDIR} \
		TARGET=${EMBEDDED_TARGET} \
		TARGET_ARCH=${EMBEDDED_TARGET_ARCH} \
		DESTDIR=${_mfstree} KERNCONF=${KERNEL} \
		${CONF_FILES} ${RPI5_MFS_KNOBS} \
		installworld installkernel distribution
	if [ -n "${RPI5_CYW_FW_DIR}" ]; then
		chroot ${CHROOTDIR} mkdir -p ${_mfstree}/boot/firmware/cyw43455
		chroot ${CHROOTDIR} sh -c "cp -p ${RPI5_CYW_FW_DIR}/brcmfmac43455-sdio.* \
			${_mfstree}/boot/firmware/cyw43455/"
	fi
	# bsdinstall's pkgbase target needs pkg(8) itself on the live system.
	eval chroot ${CHROOTDIR} env WITH_UNIFIED_OBJDIR=1 \
		make ${MAKE_FLAGS} KERNCONF=${KERNEL} -C /usr/src/release \
		PKG_ROOTDIR=${_mfstree} pkg-into-root
	chroot ${CHROOTDIR} sh ${WORLDDIR}/release/arm64/rpi5/mkmfsroot.sh \
		-k ${_kpkg} ${_mfstree} ${OBJDIR}/mfsroot.ufs || return 1

	chroot ${CHROOTDIR} mount /dev/${mddev}${ROOTFSPART_SUFFIX} ${DESTDIR}

	_dist=${DESTDIR}/usr/freebsd-dist
	chroot ${CHROOTDIR} mkdir -p ${_dist}
	chroot ${CHROOTDIR} cp -p ${OBJDIR}/base.txz ${OBJDIR}/kernel.txz \
		${_dist}/
	chroot ${CHROOTDIR} sh -c "cd ${_dist} && \
		sh ${WORLDDIR}/release/scripts/make-manifest.sh \
		base.txz kernel.txz > MANIFEST"

	_pkgs=${DESTDIR}/usr/freebsd-packages
	chroot ${CHROOTDIR} mkdir -p ${_pkgs}/repos
	chroot ${CHROOTDIR} cp -Rp ${OBJDIR}/pkgbase-small/offline ${_pkgs}/
	chroot ${CHROOTDIR} cp -p \
		${WORLDDIR}/release/scripts/FreeBSD-base-offline.conf \
		${_pkgs}/repos/

	sync
	umount_loop ${CHROOTDIR}/${DESTDIR}

	return 0
}

# Everything the firmware reads: its configuration, the loader, the live
# root and the device trees.
arm_install_boot() {
	local _fat _bootfiles _dtb

	_fat="${DESTDIR%${KERNEL}}fat"
	chroot ${CHROOTDIR} mkdir -p ${_fat}
	chroot ${CHROOTDIR} mount_msdosfs /dev/${mddev}${EFIPART_SUFFIX} ${_fat}

	_bootfiles="$(chroot ${CHROOTDIR} \
		env TARGET=${EMBEDDED_TARGET} TARGET_ARCH=${EMBEDDED_TARGET_ARCH} \
		WITH_UNIFIED_OBJDIR=yes \
		make -C ${WORLDDIR}/stand -V .OBJDIR)"
	_bootfiles="$(chroot ${CHROOTDIR} realpath ${_bootfiles})"

	chroot ${CHROOTDIR} cp ${_bootfiles}/arm64/rpiboot/rpiboot.bin ${_fat}/
	chroot ${CHROOTDIR} cp ${OBJDIR}/mfsroot.ufs ${_fat}/
	chroot ${CHROOTDIR} cp ${WORLDDIR}/release/arm64/rpi5/config.txt \
		${_fat}/config.txt

	if [ ! -f ${CHROOTDIR}${DTB_DIR}/${DTB_REQUIRED} ]; then
		echo "${DTB_DIR}/${DTB_REQUIRED} is missing;" \
		    "does sysutils/rpi-firmware carry the Pi 5 device trees?"
		umount_loop ${CHROOTDIR}/${_fat}
		return 1
	fi
	for _dtb in ${DTB_REQUIRED} ${DTB} LICENCE.broadcom; do
		if [ -f ${CHROOTDIR}${DTB_DIR}/${_dtb} ]; then
			chroot ${CHROOTDIR} cp -p ${DTB_DIR}/${_dtb} ${_fat}/
		fi
	done
	if [ -d ${CHROOTDIR}${OL_DIR} ]; then
		chroot ${CHROOTDIR} cp -Rp ${OL_DIR} ${_fat}/
	fi

	sync
	umount_loop ${CHROOTDIR}/${_fat}
	chroot ${CHROOTDIR} rmdir ${_fat}

	return 0
}

# No U-Boot: the firmware starts rpiboot itself.
arm_install_uboot() {
	return 0
}
